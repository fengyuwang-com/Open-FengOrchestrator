<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FENG OS · 帝国版图</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
<style>
/* ============ 黑金帝国定调：深墨黑 + 香槟金 + 朱砂点缀 ============ */
:root{
  --bg:#0a0a0c;            /* 深墨黑 */
  --gold:#c9a45c;          /* 香槟金主色 */
  --gold-hi:#e8cf9a;       /* 高光金 */
  --gold-lo:#8a6d3b;       /* 暗金 */
  --gold-line:rgba(201,164,92,.38); /* 1px 金线 */
  --red:#c0392b;           /* 朱砂，仅点缀 */
  --ink:#e6ddc8;           /* 米金正文 */
  --dim:#7d7360;           /* 暗金灰 */
  --panel:rgba(14,13,11,.72);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
/* 深色大理石/绸缎渐变底 */
#veil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 700px at 50% 18%, rgba(201,164,92,.10), transparent 60%),
    radial-gradient(900px 600px at 82% 80%, rgba(138,109,59,.08), transparent 65%),
    radial-gradient(800px 500px at 12% 70%, rgba(201,164,92,.07), transparent 60%),
    radial-gradient(700px 900px at 8% 30%, rgba(201,164,92,.05), transparent 62%),
    radial-gradient(1000px 500px at 45% 96%, rgba(201,164,92,.06), transparent 60%),
    repeating-linear-gradient(115deg, rgba(201,164,92,.012) 0 2px, transparent 2px 90px),
    repeating-linear-gradient(24deg, rgba(232,207,154,.010) 0 1px, transparent 1px 130px),
    linear-gradient(180deg,#0b0a09 0%,#0a0a0c 45%,#08080a 100%);}
/* ============ 开场：金箔汇聚"豐" → FENG OS 宋体逐字 ============ */
#intro{position:fixed;inset:0;z-index:100;background:#080807;display:flex;align-items:center;justify-content:center;flex-direction:column}
#introCanvas{position:absolute;inset:0}
#introTitle{position:relative;font-family:var(--serif);font-weight:900;
  font-size:clamp(52px,9vw,128px);letter-spacing:.3em;color:var(--gold-hi);
  text-shadow:0 0 24px rgba(201,164,92,.35),0 0 60px rgba(201,164,92,.15);opacity:0}
#introTitle span{display:inline-block;opacity:0;transform:translateY(14px)}
#introSub{position:relative;margin-top:22px;color:var(--gold);letter-spacing:.5em;font-family:var(--serif);font-size:14px;opacity:0;white-space:nowrap}
#introRule{position:relative;width:0;height:1px;margin-top:26px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* ============ 主界面 ============ */
#main{position:fixed;inset:0;opacity:0;display:none}
#galaxy{position:absolute;inset:0;cursor:grab}
.hud{position:absolute;z-index:10;background:var(--panel);border:1px solid var(--gold-line);
  backdrop-filter:blur(10px);padding:12px 18px;
  box-shadow:0 0 24px rgba(201,164,92,.06) inset,0 8px 30px rgba(0,0,0,.45)}
/* 金线雕花角饰 */
.hud::before{content:"";position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.hud::after{content:"";position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}
#header{top:16px;left:16px;display:flex;gap:34px;align-items:center}
#header h1{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--gold-hi);letter-spacing:.28em;margin-right:8px}
#header .stat b{font-family:var(--serif);color:var(--gold);font-size:20px;font-weight:600}
#header .stat span{color:var(--dim);font-size:10px;display:block;letter-spacing:.2em;margin-top:5px}
#sysHud{top:16px;right:16px;width:360px}
#sysHud h3{font-family:var(--serif);font-size:13px;color:var(--gold);letter-spacing:.3em;margin-bottom:8px;font-weight:600}
#charts{width:100%;height:180px}
#lights{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.light{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);letter-spacing:.08em}
.dot{width:8px;height:8px;border-radius:50%;background:#2a251c}
.dot.on{animation:breath 3.2s ease-in-out infinite}
.dot.off{background:var(--red);box-shadow:0 0 6px rgba(192,57,43,.5)}
@keyframes breath{50%{opacity:.55}}
#foot{bottom:16px;left:16px;font-size:10px;color:var(--dim);letter-spacing:.2em}
/* 今日战报：桌面端隐藏，移动端成区 */
#report{display:none}
#report h3{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.34em;margin-bottom:6px;font-weight:600}
.repRow{display:flex;justify-content:space-between;gap:8px}
.rep{text-align:center;flex:1}
.rep b{display:block;font-family:var(--serif);font-weight:600;color:var(--gold-hi);font-size:34px;line-height:1.1;text-shadow:0 0 18px rgba(201,164,92,.3)}
.rep i{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.22em}
#vitalsCaret{display:none;float:right;color:var(--gold-lo);transition:transform .4s}
#vitalsToggle.open #vitalsCaret{transform:rotate(180deg)}
/* 今日帝国动态：金线卷宗风，按项目分组 */
#daily{position:absolute;left:16px;bottom:16px;width:430px;z-index:10}
#daily h3{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.34em;margin-bottom:2px;font-weight:600}
#daily .drule{height:1px;margin:6px 0 2px;background:linear-gradient(90deg,var(--gold-line),transparent)}
#dailyBody{margin-top:10px;max-height:260px;overflow:auto}
.dailyItem{padding:8px 0;border-bottom:1px solid rgba(201,164,92,.12);display:flex;align-items:baseline;gap:10px}
.dailyItem:last-child{border-bottom:none}
.dailyItem .dn{font-family:var(--serif);color:var(--gold);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38%}
.dailyItem .ds{color:#b8ad94;font-size:11px;line-height:1.6;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dailyItem .dt{color:var(--dim);font-size:10px;white-space:nowrap}
.dailyBadge{display:inline-block;min-width:22px;text-align:center;border:1px solid var(--gold-line);color:var(--gold-hi);font-family:var(--serif);font-size:13px;padding:0 5px;background:rgba(201,164,92,.08)}
#dailyNote{font-size:10px;color:var(--dim);letter-spacing:.12em;margin-top:6px}
#dailyNote b{color:var(--gold-hi);font-weight:600;font-family:var(--serif)}
/* 项目档案卡：金线卡片 + 宋体标题 */
#card{position:absolute;z-index:20;right:16px;bottom:16px;width:390px;max-height:62vh;overflow:auto;display:none;
  background:var(--panel);border:1px solid var(--gold-line);backdrop-filter:blur(12px);padding:22px;
  box-shadow:0 0 30px rgba(201,164,92,.08) inset,0 12px 40px rgba(0,0,0,.5)}
#card h2{font-family:var(--serif);color:var(--gold-hi);font-size:24px;font-weight:600;margin-bottom:4px;letter-spacing:.06em}
#card .type{color:var(--gold-lo);font-size:11px;letter-spacing:.24em}
#card .rule{height:1px;margin:12px 0;background:linear-gradient(90deg,var(--gold-line),transparent)}
#card p{color:#b8ad94;font-size:13px;line-height:1.9}
#card .nums{display:flex;gap:26px;margin:14px 0}
#card .nums b{display:block;font-family:var(--serif);font-size:26px;color:var(--gold);font-weight:600}
#card .nums i{font-style:normal;font-size:10px;color:var(--dim);letter-spacing:.15em}
#card .tag{display:inline-block;border:1px solid var(--gold-line);color:var(--gold);font-size:11px;padding:2px 9px;margin:2px 4px 2px 0;letter-spacing:.1em}
#card .close{position:absolute;top:8px;right:14px;color:var(--dim);cursor:pointer;font-size:18px}
#card .close:hover{color:var(--gold-hi)}
#card .act{font-size:10px;color:var(--dim);letter-spacing:.05em;word-break:break-all}
/* 最近提交摘要（金线卷宗） */
#cardCommits h3{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.3em;font-weight:600;margin:2px 0 8px}
#cardCommits .commit{padding:5px 0;border-bottom:1px solid rgba(201,164,92,.12);font-size:11px;line-height:1.6}
#cardCommits .commit:last-child{border-bottom:none}
#cardCommits .commit b{color:var(--gold-lo);font-weight:400;margin-right:8px;font-size:10px;letter-spacing:.06em}
#cardCommits .commit span{color:#b8ad94}
#tip{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);z-index:10;color:var(--dim);font-family:var(--serif);font-size:12px;letter-spacing:.4em}
@media (max-width:820px){
  /* 顶栏：统计数字与标签呼吸间距 */
  #header{top:10px;left:10px;right:10px;gap:18px;flex-wrap:nowrap;overflow:hidden;padding:12px 14px}
  #header h1{font-size:14px;letter-spacing:.16em;white-space:nowrap;flex-shrink:0}
  #header .stat{white-space:nowrap;flex-shrink:1;min-width:0}
  #header .stat b{font-size:16px;display:block}
  #header .stat span{font-size:9px;display:block;margin-top:4px;letter-spacing:.18em}
  /* 今日战报大数字区（D4） */
  #report{display:block;position:absolute;z-index:10;top:78px;left:10px;right:10px;padding:14px 16px}
  /* 生命体征：移动端折叠卡 */
  #sysHud{display:block;top:auto;bottom:12px;left:10px;right:10px;width:auto;padding:10px 14px}
  #vitalsToggle{cursor:pointer;margin-bottom:0}
  #vitalsCaret{display:inline}
  #vitalsBody{display:none}
  #vitalsBody #charts{height:110px}
  /* 今日帝国动态：手机端在战报区下方，纵向堆叠卡；底部收在鎏金按钮之上，不与悬浮元素叠压 */
  #daily{top:206px;left:10px;right:10px;bottom:132px;width:auto;padding:12px 14px;
    display:flex;flex-direction:column}
  .dailyItem{flex-wrap:wrap;background:rgba(14,13,11,.55);border:1px solid rgba(201,164,92,.16);padding:10px 12px;margin-bottom:8px}
  .dailyItem:last-child{margin-bottom:0}
  .dailyItem .dn{max-width:60%;font-size:15px}
  .dailyItem .ds{white-space:normal;font-size:11px;min-width:100%;order:3;margin-top:4px}
  .dailyItem .dt{margin-left:auto}
  #dailyBody{max-height:none;flex:1;min-height:0;overflow:auto}
  #card{left:12px;right:12px;bottom:12px;width:auto;max-height:48vh;z-index:30}
  #introSub{font-size:11px;letter-spacing:.3em;margin-top:16px}
  #tip{top:200px;bottom:auto;font-size:10px;letter-spacing:.24em;white-space:nowrap;text-align:center;width:100%;left:0;transform:none}
  #foot{display:none}
  /* 画册模式入口：仅移动端（375 竖屏），鎏金按钮 */
  #albumBtn{display:block;position:absolute;z-index:12;bottom:70px;left:10px;right:10px;padding:13px 0;
    font-family:var(--serif);font-size:14px;letter-spacing:.42em;color:var(--gold-hi);text-indent:.42em;
    background:linear-gradient(180deg,rgba(201,164,92,.16),rgba(201,164,92,.06)),#100e0a;
    border:1px solid var(--gold-line);cursor:pointer;
    box-shadow:0 0 24px rgba(201,164,92,.10) inset,0 8px 30px rgba(0,0,0,.45)}
  #albumBtn:active{background:rgba(201,164,92,.22)}
}
/* ============ D4 画册模式：帝国族谱（每屏一战报，奢侈品画册留白构图） ============ */
#album{position:fixed;inset:0;z-index:95;display:none;flex-direction:column;background:var(--bg);
  background:
    radial-gradient(900px 620px at 50% 22%, rgba(201,164,92,.09), transparent 62%),
    radial-gradient(700px 520px at 85% 85%, rgba(138,109,59,.07), transparent 65%),
    linear-gradient(180deg,#0b0a09 0%,#0a0a0c 45%,#08080a 100%);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#albumBar{position:absolute;top:0;left:0;height:2px;width:0;z-index:5;
  background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));box-shadow:0 0 8px rgba(201,164,92,.55);transition:width .7s cubic-bezier(.22,1,.36,1)}
#albumIdx{position:absolute;top:14px;right:18px;z-index:5;font-family:var(--serif);color:var(--gold-lo);font-size:11px;letter-spacing:.32em}
#albumClose{position:absolute;top:8px;left:14px;z-index:5;color:var(--dim);font-size:22px;cursor:pointer;font-family:var(--serif);line-height:1;padding:6px}
#albumClose:hover{color:var(--gold-hi)}
#albumStage{position:absolute;inset:0}
.apage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 36px;will-change:transform,opacity}
.apage .kicker{font-family:var(--serif);font-size:10px;letter-spacing:.55em;color:var(--gold-lo);margin-bottom:30px;text-indent:.55em}
.apage h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,11vw,52px);color:var(--gold-hi);
  letter-spacing:.08em;line-height:1.3;text-shadow:0 0 28px rgba(201,164,92,.32);word-break:break-all}
.apage .arule{width:58px;height:1px;margin:28px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.apage .adesc{color:#b8ad94;font-size:13px;line-height:1.95;max-width:300px}
.apage .anums{display:flex;gap:32px;justify-content:center;margin-top:4px}
.apage .anums>div{min-width:64px}
.apage .anums b{display:block;font-family:var(--serif);font-weight:600;font-size:29px;color:var(--gold);line-height:1.2;
  text-shadow:0 0 16px rgba(201,164,92,.25)}
.apage .anums i{font-style:normal;font-size:9px;color:var(--dim);letter-spacing:.2em}
.apage .abar{width:min(220px,62vw);height:2px;background:rgba(201,164,92,.14);margin:26px auto 8px;position:relative}
.apage .abar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));
  box-shadow:0 0 6px rgba(201,164,92,.5)}
.apage .aact{font-size:9px;color:var(--dim);letter-spacing:.22em}
.apage .atags{margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:300px}
.apage .atag{border:1px solid var(--gold-line);color:var(--gold);font-size:10px;padding:2px 9px;letter-spacing:.1em}
.apage .acommits{margin-top:30px;width:100%;max-width:320px;text-align:left}
.apage .acommits h3{font-family:var(--serif);font-size:11px;color:var(--gold);letter-spacing:.34em;font-weight:600;margin-bottom:8px;text-align:center}
.apage .acommits .commit{padding:6px 0;border-bottom:1px solid rgba(201,164,92,.12);font-size:11px;line-height:1.65}
.apage .acommits .commit:last-child{border-bottom:none}
.apage .acommits .commit b{color:var(--gold-lo);font-weight:400;margin-right:8px;font-size:10px}
.apage .acommits .commit span{color:#b8ad94}
.apage .aend{margin-top:44px;display:inline-block;font-family:var(--serif);font-size:13px;letter-spacing:.42em;text-indent:.42em;
  color:var(--gold-hi);border:1px solid var(--gold-line);padding:12px 26px;cursor:pointer;
  background:linear-gradient(180deg,rgba(201,164,92,.14),rgba(201,164,92,.05))}
.apage .ahint{position:absolute;bottom:26px;left:0;right:0;font-size:9px;color:var(--dim);letter-spacing:.4em;text-align:center}
</style>
</head>
<body>
<div id="veil"></div>

<!-- 开场：金箔粒子汇聚成"豐" → 宋体 FENG OS 逐字浮现 → 过渡到帝国版图 -->
<div id="intro">
  <canvas id="introCanvas"></canvas>
  <div id="introTitle"></div>
  <div id="introRule"></div>
  <div id="introSub">F E N G &nbsp;O S &nbsp;·&nbsp; 帝 国 版 图</div>
</div>

<div id="main">
  <canvas id="galaxy"></canvas>
  <div class="hud" id="header">
    <h1>FENG OS</h1>
    <div class="stat"><b id="stProj">–</b><span>项目疆域</span></div>
    <div class="stat"><b id="stFiles">–</b><span>代码文件</span></div>
    <div class="stat"><b id="stActive">–</b><span>近30天活跃</span></div>
  </div>
  <div class="hud" id="sysHud">
    <h3 id="vitalsToggle">帝国生命体征<span id="vitalsCaret">▾</span></h3>
    <div id="vitalsBody">
      <div id="charts"></div>
      <div id="lights"></div>
    </div>
  </div>
  <!-- 今日战报：超大宋体数字区（移动端成区，桌面端隐藏） -->
  <div class="hud" id="report">
    <h3>今日战报</h3>
    <div class="repRow">
      <div class="rep"><b id="rpProj">–</b><i>项目疆域</i></div>
      <div class="rep"><b id="rpFiles">–</b><i>代码文件</i></div>
      <div class="rep"><b id="rpActive">–</b><i>近30天活跃</i></div>
    </div>
  </div>
  <!-- 今日帝国动态（D5）：金线卷宗 · 按项目分组 · 手机端在战报区下方成区 -->
  <div class="hud" id="daily">
    <h3 id="dailyTitle">今日帝国动态</h3><div class="drule"></div>
    <div id="dailyBody"><div class="act" style="font-size:10px;color:var(--dim)">史官巡阅疆域中…</div></div>
    <div id="dailyNote"></div>
  </div>
  <div id="tip">拖动旋转 · 滚轮缩放 · 点击星球查阅项目档案</div>
  <!-- D4 画册模式入口：仅移动端显示，鎏金按钮 -->
  <button id="albumBtn">翻 开 帝 国 族 谱</button>
  <div class="hud" id="card"><span class="close" onclick="document.getElementById('card').style.display='none'">✕</span><div id="cardBody"></div></div>
  <div id="foot">FENG OS · 数据来自本机实时探针 · 严禁对外</div>
</div>

<!-- D4 画册模式：帝国族谱（序言屏 + 每项目一战报屏 + 跋屏，上下/左右滑动翻阅） -->
<div id="album">
  <div id="albumBar"></div>
  <span id="albumIdx"></span>
  <span id="albumClose">✕</span>
  <div id="albumStage"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
